name: Publish to NuGet

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Test
        run: dotnet test -c Release --no-build --verbosity normal

#      - name: Pack Dryv
#        run: dotnet pack Dryv/Dryv.csproj -c Release --no-build -o ./nupkgs
#
#      - name: Pack Dryv.AspNetCore
#        run: dotnet pack Dryv.AspNetCore/Dryv.AspNetCore.csproj -c Release --no-build -o ./nupkgs

      - name: Pack Dryv.HotChocolate
        run: dotnet pack Dryv.HotChocolate/Dryv.HotChocolate.csproj -c Release --no-build -o ./nupkgs

      - name: NuGet login (OIDC)
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: mhusseini

      - name: Push to NuGet
        run: dotnet nuget push ./nupkgs/*.nupkg --source https://api.nuget.org/v3/index.json --api-key ${{ steps.nuget-login.outputs.token }}
