<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dryv Demo - REST API + DryvJS</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/water.css@2/out/water.css" />
    <style>
        .error { color: #e74c3c; font-size: 0.85em; display: block; margin-top: 0.25em; }
        .input-error { border-color: #e74c3c; }
        .success { color: #27ae60; font-weight: bold; }
        form > div { margin-bottom: 1rem; }
    </style>
</head>
<body>
    <h1>Dryv Demo &mdash; REST API + DryvJS (Plain JavaScript)</h1>
    <p>This demo fetches translated validation rules from a REST API endpoint and uses <strong>DryvJS</strong> directly in plain JavaScript for client-side validation.</p>

    <form id="registrationForm">
        <div>
            <label for="firstName">First Name</label>
            <input type="text" id="firstName" name="firstName" />
            <span class="error" id="error-firstName"></span>
        </div>

        <div>
            <label for="lastName">Last Name</label>
            <input type="text" id="lastName" name="lastName" />
            <span class="error" id="error-lastName"></span>
        </div>

        <div>
            <label for="email">Email</label>
            <input type="email" id="email" name="email" />
            <span class="error" id="error-email"></span>
        </div>

        <div>
            <label for="password">Password</label>
            <input type="password" id="password" name="password" />
            <span class="error" id="error-password"></span>
        </div>

        <div>
            <label for="confirmPassword">Confirm Password</label>
            <input type="password" id="confirmPassword" name="confirmPassword" />
            <span class="error" id="error-confirmPassword"></span>
        </div>

        <button type="submit">Register</button>
    </form>

    <div id="successMessage" class="success" style="display:none;"></div>

    <!-- Load DryvJS from CDN -->
    <script src="https://cdn.jsdelivr.net/npm/dryvjs/dist/index.umd.js"></script>

    <!-- Load validation rules from the server API -->
    <script src="/api/validation-rules"></script>

    <script>
        (function () {
            var ruleSet = window.dryv.v['registration'];
            var form = document.getElementById('registrationForm');
            var successDiv = document.getElementById('successMessage');

            var options = Object.assign({}, dryvjs.defaultDryvOptions, {
                callServer: function (url, method, data) {
                    return fetch(url, {
                        method: method,
                        headers: { 'Content-Type': 'application/json' },
                        body: data ? JSON.stringify(data) : undefined
                    }).then(function (r) { return r.json(); });
                }
            });

            var session = new dryvjs.DryvValidationSession(options, ruleSet);

            function getModel() {
                return {
                    firstName: document.getElementById('firstName').value,
                    lastName: document.getElementById('lastName').value,
                    email: document.getElementById('email').value,
                    password: document.getElementById('password').value,
                    confirmPassword: document.getElementById('confirmPassword').value
                };
            }

            function clearErrors() {
                document.querySelectorAll('.error').forEach(function (el) { el.textContent = ''; });
                document.querySelectorAll('.input-error').forEach(function (el) { el.classList.remove('input-error'); });
                successDiv.style.display = 'none';
            }

            function showErrors(results) {
                results.forEach(function (r) {
                    if (r.result && r.result.type === 'error') {
                        var errorSpan = document.getElementById('error-' + r.path);
                        var input = document.getElementById(r.path);
                        if (errorSpan) errorSpan.textContent = r.result.text;
                        if (input) input.classList.add('input-error');
                    }
                });
            }

            form.addEventListener('submit', async function (e) {
                e.preventDefault();
                clearErrors();

                var model = getModel();
                var validator = new dryvjs.DryvObjectValidator(model, session, undefined, options);
                var result = await validator.validate();

                if (!result.success) {
                    showErrors(result.results);
                    return;
                }

                // Client validation passed — submit to server
                var response = await fetch('/api/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(model)
                });

                var data = await response.json();

                if (response.ok) {
                    successDiv.textContent = data.message;
                    successDiv.style.display = 'block';
                    form.style.display = 'none';
                } else {
                    // Show server-side errors
                    if (data.errors) {
                        data.errors.forEach(function (err) {
                            var errorSpan = document.getElementById('error-' + err.path);
                            if (errorSpan && err.message && err.message.length > 0) {
                                errorSpan.textContent = err.message[0].text || err.message[0];
                            }
                        });
                    }
                }
            });
        })();
    </script>
</body>
</html>
